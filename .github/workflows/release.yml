# Builds the Windows installer and publishes it to GitHub Releases (flows/acars.md ACR-2).
# Runs when a version tag such as v1.0.1 is pushed. The tag must match "version" in
# package.json. ACARS checks GitHub Releases for updates when it starts and every 6 hours.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
