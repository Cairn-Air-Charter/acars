# Builds the Windows installer and publishes it to GitHub Releases (flows/acars.md ACR-2).
# Runs when a version tag such as v1.0.1 is pushed. The tag must match "version" in
# package.json. ACARS checks GitHub Releases for updates when it starts and every 6 hours.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # The commit this version was built from, shown at the bottom of ACARS (flows/versions.md VER-2)
      - name: Record the commit
        shell: bash
        run: echo "{\"commit\": \"$GITHUB_SHA\"}" > src/build-info.json
      # Build only. Letting electron-builder publish uploads files in parallel, and each upload
      # can create its own release, so one version ended up split across two releases and
      # ACARS couldn't find latest.yml. One step below creates one release with every file.
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: Publish one release with every file
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*-Setup.exe dist/*-Setup.exe.blockmap dist/latest.yml \
            --title "Cairn ACARS ${GITHUB_REF_NAME#v}" \
            --notes "Cairn ACARS ${GITHUB_REF_NAME#v} for Windows 10 and 11. Download the file ending in Setup.exe."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
